name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Xcode 16.4 (Swift 6.1.2) 的编译器在 SILGen 阶段崩溃 (signal 11)，
      # 代码按 Swift 6.3 语义编写，需切换到镜像内最新的 Xcode 26.x。
      # DEVELOPER_DIR 无需 sudo，且自动跟随镜像更新选最新版本。
      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | grep -E 'Xcode_[0-9]' | sort -V | tail -1)
          if [[ -n "$NEWEST" ]]; then
            echo "DEVELOPER_DIR=${NEWEST}/Contents/Developer" >> "$GITHUB_ENV"
            echo "Selected ${NEWEST}"
          fi
          swift --version

      - name: Run tests
        run: swift test

  # 只在 v* tag 上发布：测试通过 → 打 .app 包 → ditto 压缩 → 上传 Release。
  # 不引第三方 action，发布走 runner 自带的 gh CLI。
  release:
    name: Package & Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | grep -E 'Xcode_[0-9]' | sort -V | tail -1)
          if [[ -n "$NEWEST" ]]; then
            echo "DEVELOPER_DIR=${NEWEST}/Contents/Developer" >> "$GITHUB_ENV"
            echo "Selected ${NEWEST}"
          fi
          swift --version

      # tag v1.2.3 → bundle 版本 1.2.3（build_app.sh 读取 VERSION 环境变量）
      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build app bundle
        run: ./build_app.sh

      # ditto 是 macOS 上打包 .app 的标准做法：保留符号链接与权限，
      # 普通 zip 会破坏这些导致应用无法启动。
      - name: Zip app bundle
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent MacDesktopNotify.app "MacDesktopNotify-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "MacDesktopNotify-${GITHUB_REF_NAME}.zip" > "MacDesktopNotify-${GITHUB_REF_NAME}.zip.sha256"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 幂等：Release 已存在则只上传产物（--clobber 覆盖同名文件），
          # 重跑 workflow 不会因为 Release 已存在而失败。
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "MacDesktopNotify ${TAG}" \
                 --generate-notes \
                 --notes-file .github/release-notes.md
          gh release upload "$TAG" \
            "build/MacDesktopNotify-${TAG}.zip" \
            "build/MacDesktopNotify-${TAG}.zip.sha256" \
            --clobber
