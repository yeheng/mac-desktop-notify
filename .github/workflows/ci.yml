name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (frontend, fmt, clippy, tests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend tests
        run: pnpm test

      # 先产出 dist/：Tauri 的 generate_context! 在编译期需要它存在。
      - name: Build frontend
        run: pnpm build

      - name: Rust format
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # 只在 v* tag 上发布：检查通过 → tauri 打 .app 包 → ditto 压缩 → 上传 Release。
  # 不引第三方 action，发布走 runner 自带的 gh CLI。
  release:
    name: Package & Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app bundle
        run: pnpm tauri build --bundles app

      # ditto 是 macOS 上打包 .app 的标准做法：保留符号链接与权限，
      # 普通 zip 会破坏这些导致应用无法启动。
      - name: Zip app bundle
        run: |
          APP="src-tauri/target/release/bundle/macos/mac-desktop-notify.app"
          ARTIFACT="mac-desktop-notify-${GITHUB_REF_NAME}"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "${ARTIFACT}.zip"
          shasum -a 256 "${ARTIFACT}.zip" > "${ARTIFACT}.zip.sha256"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 幂等：Release 已存在则只上传产物（--clobber 覆盖同名文件），
          # 重跑 workflow 不会因为 Release 已存在而失败。
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "mac-desktop-notify ${TAG}" \
                 --generate-notes \
                 --notes-file .github/release-notes.md
          gh release upload "$TAG" \
            "mac-desktop-notify-${TAG}.zip" \
            "mac-desktop-notify-${TAG}.zip.sha256" \
            --clobber
