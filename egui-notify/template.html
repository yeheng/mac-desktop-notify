<!-- egui-notify 通知卡片结构模板（HTML 子集）· 经典外观

     可用占位符：{{app}} {{title}} {{body}} {{initial}}（应用名首字符）{{time}}（相对时间）
     特殊组件：<icon> 图标色块（文字居中）、<close-button> 关闭按钮（悬停可见）、
               <actions> 操作按钮行（按钮文字由通知数据注入，样式见 action-button 选择器）、
               <spacer/> 占满横行剩余宽度，把后续元素顶到右端
     布局：元素默认纵向排列，CSS 里用 flex-direction: row 切换为横向
     样式：class 属性对应 style.css 中的类选择器，标签名即标签选择器 -->
<toast>
  <icon>{{initial}}</icon>
  <content>
    <app-name>{{app}}</app-name>
    <title-row>
      <title>{{title}}</title>
      <spacer/>
      <time>{{time}}</time>
    </title-row>
    <body>{{body}}</body>
    <actions></actions>
  </content>
  <close-button>×</close-button>
</toast>
